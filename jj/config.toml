merge-tool = "vimdiff"

[merge-tools.vimdiff]
merge-args = [
  "-f",
  "-d",
  "$output",
  "-M",
  "$left",
  "$base",
  "$right",
  "-c",
  "wincmd J",
  "-c",
  "set modifiable",
  "-c",
  "set write",
]

program = "nvim"
merge-tool-edits-conflict-markers = true

[merge-tool.git]
program = "git"
args = ["merge-file", "--diff3", "$left", "$base", "$right", "-p"]

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'


