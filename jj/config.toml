[snapshot]
auto-update-stale = true
# [git]
# push-new-bookmarks = true
# "(heads(@::) | heads(@::)- | heads(@::)-- | heads(@::)--- | @+++ | @++ | @ | @- | @-- | @--- | (trunk()+ & mine()) | trunk())",

[ui]
default-command = [
  "log",
  "-r",
  '(heads(@::) ~ (working_copies() ~ @)) | (heads(@::) ~ (working_copies() ~ @))- | roots(::(heads(@::) ~ (working_copies() ~ @)) ~ ::coalesce(trunk(), root())) | coalesce(trunk(), root()) | (bookmarks() | bookmarks()+) & (::(heads(@::) ~ (working_copies() ~ @)) ~ ::coalesce(trunk(), root())) | (@ | @+ | @-)',
  "-T",
  '''
        if(root,
            format_root_commit(self),
            label(if(current_working_copy, "working_copy"),
              concat(
                separate(" ",
                  format_short_change_id_with_change_offset(self),
                  commit_timestamp(self).ago(),

                  bookmarks,
                  tags,
                  working_copies,
                  if(conflict, label("conflict", "conflict")),
                  if(config("ui.show-cryptographic-signatures").as_boolean(),
                    format_short_cryptographic_signature(signature)),
                  if(empty, label("empty", "(empty)")),
                  if(description,
                    description.first_line(),
                    label(if(empty, "empty"), description_placeholder),
                  ),
                ),
              ),
            )
          )
''',
]

# default-command = ["log", "-r", "(::@ | @::) ~(::trunk())-"]
